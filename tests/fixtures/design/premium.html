<!doctype html>
<meta charset="utf-8">
<style>
:root{--ease:cubic-bezier(.23,1,.32,1)}
body{font-family:Georgia,serif;font-size:18px;line-height:1.5;color:#1c1f24;background:#f6f4f1;margin:0;padding:24px}
h1,h2{font-size:40px;font-weight:450;letter-spacing:-.03em;text-wrap:balance;margin:0 0 16px}
.card{border-radius:12px;padding:4px;box-shadow:0 0 0 1px rgb(0 0 0 / .07),0 1px 2px rgb(20 20 40 / .06),0 8px 16px rgb(20 20 40 / .06);background:#fbfaf8}
.card .in{border-radius:8px;padding:8px;box-shadow:0 0 0 1px rgb(0 0 0 / .07)}
button{border:0;border-radius:8px;padding:8px 16px;background:#2f5d50;color:#f6f4f1;font:inherit;transition:transform 150ms var(--ease)}
button:active{transform:scale(.97)}
</style>
<h1>A calm start</h1>
<div class="card"><div class="in">Rings, not lines.</div><p>Quiet, tidy and finished.</p></div>
<button>Save</button>
