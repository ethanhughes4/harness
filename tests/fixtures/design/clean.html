<!doctype html><html><head><meta charset="utf-8"><title>Clean</title><style>
body{font-family:Georgia,serif;font-size:18px;line-height:1.5;margin:0;padding:16px;color:#222;background:#fff}
h1,h2{font-family:Verdana,sans-serif;font-weight:700;margin:0 0 16px}
h1{font-size:40px}h2{font-size:24px}
section{margin:32px 0;padding:16px}
.card{border:1px solid #ccc;border-radius:8px;padding:16px;margin:8px 0}
a.btn,button{background:#0a6b5c;color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;text-decoration:none;display:inline-block}
a:focus-visible,button:focus-visible{outline:2px solid #0a6b5c;outline-offset:2px}
td{font-variant-numeric:tabular-nums;padding:8px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .2s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<h1>Invoices for small studios</h1><p>Send an invoice in two minutes.</p>
<p><a class="btn" href="#start">Create invoice</a></p>
<section><h2>Recent</h2><div class="card"><table><tr><td>Total</td><td>1,200.00</td></tr></table></div></section>
</body></html>
